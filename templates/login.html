<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - अन्नसेतू महाराष्ट्र</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
      
</head>


<body class="bg-light">


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center text-success">
                        🍱
                    </h2>

                    <h3 class="text-center">
                        Welcome Back
                    </h3>

                    <p class="text-center text-muted">
                        Login to अन्नसेतू महाराष्ट्र
                    </p>


                    {% with messages = get_flashed_messages() %}

                        {% if messages %}

                            {% for message in messages %}

                                <div class="alert alert-warning">

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <form method="POST">

<input type="hidden" 
        name="csrf_token" 
        value="{{ csrf_token() }}">
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >

                            Login

                        </button>


                    </form>


                    <p class="text-center mt-3">

                        Don't have an account?

                        <a href="{{ url_for('register') }}">
                            Register
                        </a>

                    </p>


                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
