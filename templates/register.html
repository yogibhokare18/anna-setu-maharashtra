<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - अन्नसेतू महाराष्ट्र</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center text-success mb-4">

                        🍱 अन्नसेतू महाराष्ट्र

                    </h2>

                    <h4 class="text-center mb-4">
                        Create Account
                    </h4>


                    {% with messages = get_flashed_messages() %}

                        {% if messages %}

                            {% for message in messages %}

                                <div class="alert alert-info">

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <form method="POST">

<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Register As
                            </label>

                            <select
                                name="role"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Role
                                </option>

                                <option value="donor">
                                    🍱 Food Donor
                                </option>

                                <option value="ngo">
                                    ❤️ NGO
                                </option>

                                <option value="volunteer">
                                    🚚 Volunteer
                                </option>

                            </select>

                        </div>

                        <!-- ==============================
                            LOCATION
                            ============================== -->

                        <div class="mb-3">

                            <label class="form-label">
                                📍 Location
                            </label>

                            <div class="row">

                                <div class="col-md-6">

                                    <input
                                        type="text"
                                        name="latitude"
                                        id="latitude"
                                        class="form-control"
                                        placeholder="Latitude"
                                        readonly
                                    >

                                </div>

                                <div class="col-md-6">

                                    <input
                                        type="text"
                                        name="longitude"
                                        id="longitude"
                                        class="form-control"
                                        placeholder="Longitude"
                                        readonly
                                    >

                                </div>

                            </div>

                            <button
                                type="button"
                                class="btn btn-outline-success mt-2"
                                onclick="getLocation()"
                            >
                                📍 Get My Location
                            </button>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >

                            Create Account

                        </button>

                    </form>


                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="{{ url_for('login') }}">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
